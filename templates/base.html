<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1A1A2E">
    <title>{% block title %}MiniStore{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="{{ url_for('dashboard.index') }}" class="brand">Mini<span>Store</span></a>
            <nav aria-label="Navegação principal">
                <a href="{{ url_for('dashboard.index') }}">Dashboard</a>
                <a href="{{ url_for('clientes.listar') }}">Clientes</a>
                <a href="{{ url_for('categorias.listar') }}">Categorias</a>
                <a href="{{ url_for('produtos.listar') }}">Produtos</a>
                <a href="{{ url_for('vendas.listar') }}">Vendas</a>
            </nav>
        </div>
    </header>

    <main>
        {% for category, message in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ category }}" role="status">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>MiniStore &copy; 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
