{% extends 'base.html' %}

{% block title %}{{ 'Editar produto' if produto else 'Novo produto' }} — MiniStore{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>{{ 'Editar produto' if produto else 'Novo produto' }}</h1>
        <p class="page-description">Informe os dados do produto.</p>
    </div>
</div>

<form method="POST" class="form-card">
    <div class="form-grid">
        <div class="form-group">
            <label for="codigo">Código <span class="required">*</span></label>
            <input type="text" id="codigo" name="codigo" class="form-control" maxlength="50"
                   value="{{ produto.codigo if produto else '' }}" required>
        </div>
        <div class="form-group">
            <label for="nome">Nome <span class="required">*</span></label>
            <input type="text" id="nome" name="nome" class="form-control" maxlength="100"
                   value="{{ produto.nome if produto else '' }}" required>
        </div>
        <div class="form-group">
            <label for="preco">Preço (R$) <span class="required">*</span></label>
            <input type="number" id="preco" name="preco" class="form-control" min="0.01" step="0.01"
                   value="{{ produto.preco if produto and produto.preco is defined else '' }}" required>
        </div>
        <div class="form-group">
            <label for="id_categoria">Categoria</label>
            <select id="id_categoria" name="id_categoria" class="form-control">
                <option value="">Sem categoria</option>
                {% for categoria in categorias %}
                <option value="{{ categoria.id }}" {% if produto and (produto.id_categoria|string) == (categoria.id|string) %}selected{% endif %}>{{ categoria.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group form-group-full">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" class="form-control" rows="4">{{ produto.descricao if produto and produto.descricao else '' }}</textarea>
        </div>
    </div>
    <p class="form-help"><span class="required">*</span> Campos obrigatórios.</p>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ 'Salvar alterações' if produto else 'Cadastrar produto' }}</button>
        <a href="{{ url_for('produtos.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
