{% extends 'base.html' %}

{% block title %}
    {{ 'Editar' if cliente else 'Novo' }} Cliente — MiniStore
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ 'Editar' if cliente else 'Novo' }} Cliente</h1>
</div>

{% if cliente %}
<form action="{{ url_for('clientes.editar', id=cliente.id) }}" method="POST">
{% else %}
<form action="{{ url_for('clientes.novo') }}" method="POST">
{% endif %}

    <div class="form-group">
        <label for="nome">Nome *</label>
        <input type="text" id="nome" name="nome"
               class="form-control"
               value="{{ cliente.nome if cliente else '' }}"
               required>
    </div>

    <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email"
               class="form-control"
               value="{{ cliente.email|default('') }}">
    </div>

    <div class="form-group">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone"
               class="form-control"
               value="{{ cliente.telefone|default('') }}">
    </div>

    <div class="form-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf"
               class="form-control"
               value="{{ cliente.cpf|default('') }}">
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">
            {{ 'Salvar' if cliente else 'Cadastrar' }}
        </button>
        <a href="{{ url_for('clientes.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>

</form>
{% endblock %}
