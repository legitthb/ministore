{% extends 'base.html' %}

{% block title %}Nova Venda — MiniStore{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Nova Venda</h1>
</div>

{% if clientes and produtos %}
<form method="POST">

    <div class="form-group">
        <label for="id_cliente">Cliente *</label>
        <select id="id_cliente" name="id_cliente" class="form-control" required>
            <option value="">Selecione um cliente</option>
            {% for cliente in clientes %}
            <option value="{{ cliente.id }}" {% if form_data and form_data.get('id_cliente') == cliente.id|string %}selected{% endif %}>{{ cliente.nome }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label>Produtos *</label>
        <div id="itens-venda">
            {% for item in (itens_form or [{}]) %}
            <div class="item-venda" style="display:flex; gap:8px; margin-bottom:8px">
                <select name="produto_id[]" class="form-control" required>
                    <option value="">Selecione um produto</option>
                    {% for produto in produtos %}
                    <option value="{{ produto.id }}" {% if item.produto_id == produto.id|string %}selected{% endif %}>{{ produto.codigo }} — {{ produto.nome }} (R$ {{ produto.preco|brl }})</option>
                    {% endfor %}
                </select>
                <input type="number" name="quantidade[]" class="form-control" style="width:100px"
                       min="1" step="1" value="{{ item.quantidade or 1 }}" required>
                <button type="button" class="btn btn-danger remover-item">Remover</button>
            </div>
            {% endfor %}
        </div>
        <button type="button" id="adicionar-item" class="btn btn-secondary">Adicionar produto</button>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Registrar</button>
        <a href="{{ url_for('vendas.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>

</form>

<template id="modelo-item-venda">
    <div class="item-venda" style="display:flex; gap:8px; margin-bottom:8px">
        <select name="produto_id[]" class="form-control" required>
            <option value="">Selecione um produto</option>
            {% for produto in produtos %}
            <option value="{{ produto.id }}">{{ produto.codigo }} — {{ produto.nome }} (R$ {{ produto.preco|brl }})</option>
            {% endfor %}
        </select>
        <input type="number" name="quantidade[]" class="form-control" style="width:100px" min="1" step="1" value="1" required>
        <button type="button" class="btn btn-danger remover-item">Remover</button>
    </div>
</template>
{% endif %}
{% endblock %}
